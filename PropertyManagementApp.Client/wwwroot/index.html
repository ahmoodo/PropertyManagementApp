<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Property Management App</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <style>
        /* print styles for statements */
        @@media print {
            .mud-nav-menu, .mud-appbar, .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
        .status-badge-paid { background: #4caf50 !important; color: white !important; }
        .status-badge-late { background: #f44336 !important; color: white !important; }
        .status-badge-partial { background: #ff9800 !important; color: white !important; }
        .status-badge-unpaid { background: #9e9e9e !important; color: white !important; }
        .kanban-col { min-height: 400px; }
    </style>
</head>
<body>
    <div id="app">Loading...</div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">X</a>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // GPS capture helper used by WorkLogEntry
        window.getGeolocation = function() {
            return new Promise(function(resolve, reject) {
                if (!navigator.geolocation) {
                    reject("Geolocation not supported");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    function(pos) {
                        resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude });
                    },
                    function(err) {
                        reject(err.message);
                    }
                );
            });
        };

        // trigger a browser download of a blob
        window.downloadFile = function(filename, content, mimeType) {
            var blob = new Blob([content], { type: mimeType });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        window.printPage = function() {
            window.print();
        };
    </script>
</body>
</html>
